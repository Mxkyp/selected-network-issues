# currencyservice (gRPC, port 7000)
#   hipstershop.CurrencyService/Convert                  <- frontend, checkoutservice
#   hipstershop.CurrencyService/GetSupportedCurrencies   <- frontend
#   grpc.health.v1.Health/Check                          <- kubelet probes
# Everything else is denied: a request matching no route below is rejected by the proxy.
# The Server comes last on purpose: when it appears, its routes and authorizations already
# exist, so applying this file never leaves the port without its policy.
apiVersion: policy.linkerd.io/v1alpha1
kind: AuthorizationPolicy
metadata:
  name: currencyservice-health
  namespace: default
  labels:
    app.kubernetes.io/part-of: zero-trust-policies
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: GRPCRoute
    name: currencyservice-health
  requiredAuthenticationRefs:
  - group: policy.linkerd.io
    kind: NetworkAuthentication
    name: kubelet-probes
---
apiVersion: gateway.networking.k8s.io/v1
kind: GRPCRoute
metadata:
  name: currencyservice-health
  namespace: default
  labels:
    app.kubernetes.io/part-of: zero-trust-policies
spec:
  parentRefs:
  - group: policy.linkerd.io
    kind: Server
    name: currencyservice
  rules:
  - matches:
    - method:
        service: grpc.health.v1.Health
        method: Check
---
apiVersion: policy.linkerd.io/v1alpha1
kind: AuthorizationPolicy
metadata:
  name: currencyservice-convert
  namespace: default
  labels:
    app.kubernetes.io/part-of: zero-trust-policies
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: GRPCRoute
    name: currencyservice-convert
  requiredAuthenticationRefs:
  - group: policy.linkerd.io
    kind: MeshTLSAuthentication
    name: callers-frontend-checkout
---
apiVersion: gateway.networking.k8s.io/v1
kind: GRPCRoute
metadata:
  name: currencyservice-convert
  namespace: default
  labels:
    app.kubernetes.io/part-of: zero-trust-policies
spec:
  parentRefs:
  - group: policy.linkerd.io
    kind: Server
    name: currencyservice
  rules:
  - matches:
    - method:
        service: hipstershop.CurrencyService
        method: Convert
---
apiVersion: policy.linkerd.io/v1alpha1
kind: AuthorizationPolicy
metadata:
  name: currencyservice-supported
  namespace: default
  labels:
    app.kubernetes.io/part-of: zero-trust-policies
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: GRPCRoute
    name: currencyservice-supported
  requiredAuthenticationRefs:
  - group: policy.linkerd.io
    kind: MeshTLSAuthentication
    name: callers-frontend
---
apiVersion: gateway.networking.k8s.io/v1
kind: GRPCRoute
metadata:
  name: currencyservice-supported
  namespace: default
  labels:
    app.kubernetes.io/part-of: zero-trust-policies
spec:
  parentRefs:
  - group: policy.linkerd.io
    kind: Server
    name: currencyservice
  rules:
  - matches:
    - method:
        service: hipstershop.CurrencyService
        method: GetSupportedCurrencies
---
apiVersion: policy.linkerd.io/v1beta3
kind: Server
metadata:
  name: currencyservice
  namespace: default
  labels:
    app.kubernetes.io/part-of: zero-trust-policies
spec:
  podSelector:
    matchLabels:
      app: currencyservice
  port: 7000
  proxyProtocol: gRPC
