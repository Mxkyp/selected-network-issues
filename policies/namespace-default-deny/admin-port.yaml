# Phase 2: the Linkerd proxy admin port (4191, "linkerd-admin") of every meshed pod in `default`.
# Needed only when the namespace runs with config.linkerd.io/default-inbound-policy: deny,
# because that port has no other Server and would then refuse everything:
#   /metrics        <- metrics-scraper (the Prometheus that collects proxy metrics)
#   /live, /ready   <- kubelet probes of the proxy itself
# Everything else on the port (for example /metrics from any other pod) is denied.
#
# Structure follows `linkerd viz allow-scrapes --namespace default` (edge-26.11.1); the scraper
# identity is a separate MeshTLSAuthentication so a different Prometheus means one edit,
# and probes are limited to the node addresses instead of every network.
# See README.md in this directory before applying.
apiVersion: policy.linkerd.io/v1alpha1
kind: MeshTLSAuthentication
metadata:
  name: metrics-scraper
  namespace: default
  labels:
    app.kubernetes.io/part-of: zero-trust-default-deny
spec:
  identityRefs:
  # The Prometheus bundled with linkerd-viz. Change these two values for another Prometheus.
  - kind: ServiceAccount
    name: prometheus
    namespace: linkerd-viz
---
apiVersion: policy.linkerd.io/v1alpha1
kind: AuthorizationPolicy
metadata:
  name: proxy-admin-metrics
  namespace: default
  labels:
    app.kubernetes.io/part-of: zero-trust-default-deny
spec:
  targetRef:
    group: policy.linkerd.io
    kind: HTTPRoute
    name: proxy-admin-metrics
  requiredAuthenticationRefs:
  - group: policy.linkerd.io
    kind: MeshTLSAuthentication
    name: metrics-scraper
---
apiVersion: policy.linkerd.io/v1alpha1
kind: HTTPRoute
metadata:
  name: proxy-admin-metrics
  namespace: default
  labels:
    app.kubernetes.io/part-of: zero-trust-default-deny
spec:
  parentRefs:
  - group: policy.linkerd.io
    kind: Server
    name: proxy-admin
  rules:
  - matches:
    - path:
        value: /metrics
---
apiVersion: policy.linkerd.io/v1alpha1
kind: AuthorizationPolicy
metadata:
  name: proxy-admin-probes
  namespace: default
  labels:
    app.kubernetes.io/part-of: zero-trust-default-deny
spec:
  targetRef:
    group: policy.linkerd.io
    kind: HTTPRoute
    name: proxy-admin-probes
  requiredAuthenticationRefs:
  - group: policy.linkerd.io
    kind: NetworkAuthentication
    name: kubelet-probes
---
apiVersion: policy.linkerd.io/v1alpha1
kind: HTTPRoute
metadata:
  name: proxy-admin-probes
  namespace: default
  labels:
    app.kubernetes.io/part-of: zero-trust-default-deny
spec:
  parentRefs:
  - group: policy.linkerd.io
    kind: Server
    name: proxy-admin
  rules:
  - matches:
    - path:
        value: /live
    - path:
        value: /ready
---
# The Server comes last on purpose: when it appears, its routes and authorizations already exist.
apiVersion: policy.linkerd.io/v1beta3
kind: Server
metadata:
  name: proxy-admin
  namespace: default
  labels:
    app.kubernetes.io/part-of: zero-trust-default-deny
spec:
  podSelector:
    matchExpressions:
    - key: linkerd.io/control-plane-ns
      operator: Exists
  port: linkerd-admin
  proxyProtocol: HTTP/1
