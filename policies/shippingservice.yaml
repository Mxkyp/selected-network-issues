# shippingservice (gRPC, port 50051)
#   hipstershop.ShippingService/GetQuote    <- frontend, checkoutservice
#   hipstershop.ShippingService/ShipOrder   <- checkoutservice
#   grpc.health.v1.Health/Check             <- kubelet probes
# Everything else is denied: a request matching no route below is rejected by the proxy.
# The Server comes last on purpose: when it appears, its routes and authorizations already
# exist, so applying this file never leaves the port without its policy.
apiVersion: policy.linkerd.io/v1alpha1
kind: AuthorizationPolicy
metadata:
  name: shippingservice-health
  namespace: default
  labels:
    app.kubernetes.io/part-of: zero-trust-policies
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: GRPCRoute
    name: shippingservice-health
  requiredAuthenticationRefs:
  - group: policy.linkerd.io
    kind: NetworkAuthentication
    name: kubelet-probes
---
apiVersion: gateway.networking.k8s.io/v1
kind: GRPCRoute
metadata:
  name: shippingservice-health
  namespace: default
  labels:
    app.kubernetes.io/part-of: zero-trust-policies
spec:
  parentRefs:
  - group: policy.linkerd.io
    kind: Server
    name: shippingservice
  rules:
  - matches:
    - method:
        service: grpc.health.v1.Health
        method: Check
---
apiVersion: policy.linkerd.io/v1alpha1
kind: AuthorizationPolicy
metadata:
  name: shippingservice-quote
  namespace: default
  labels:
    app.kubernetes.io/part-of: zero-trust-policies
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: GRPCRoute
    name: shippingservice-quote
  requiredAuthenticationRefs:
  - group: policy.linkerd.io
    kind: MeshTLSAuthentication
    name: callers-frontend-checkout
---
apiVersion: gateway.networking.k8s.io/v1
kind: GRPCRoute
metadata:
  name: shippingservice-quote
  namespace: default
  labels:
    app.kubernetes.io/part-of: zero-trust-policies
spec:
  parentRefs:
  - group: policy.linkerd.io
    kind: Server
    name: shippingservice
  rules:
  - matches:
    - method:
        service: hipstershop.ShippingService
        method: GetQuote
---
apiVersion: policy.linkerd.io/v1alpha1
kind: AuthorizationPolicy
metadata:
  name: shippingservice-shiporder
  namespace: default
  labels:
    app.kubernetes.io/part-of: zero-trust-policies
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: GRPCRoute
    name: shippingservice-shiporder
  requiredAuthenticationRefs:
  - group: policy.linkerd.io
    kind: MeshTLSAuthentication
    name: callers-checkout
---
apiVersion: gateway.networking.k8s.io/v1
kind: GRPCRoute
metadata:
  name: shippingservice-shiporder
  namespace: default
  labels:
    app.kubernetes.io/part-of: zero-trust-policies
spec:
  parentRefs:
  - group: policy.linkerd.io
    kind: Server
    name: shippingservice
  rules:
  - matches:
    - method:
        service: hipstershop.ShippingService
        method: ShipOrder
---
apiVersion: policy.linkerd.io/v1beta3
kind: Server
metadata:
  name: shippingservice
  namespace: default
  labels:
    app.kubernetes.io/part-of: zero-trust-policies
spec:
  podSelector:
    matchLabels:
      app: shippingservice
  port: 50051
  proxyProtocol: gRPC
