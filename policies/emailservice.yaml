# emailservice (gRPC, port 8080)
# Note: the Kubernetes Service exposes port 5000, but the Server refers to the pod port 8080.
#   hipstershop.EmailService/SendOrderConfirmation   <- checkoutservice
#   grpc.health.v1.Health/Check                      <- kubelet probes
# Everything else is denied: a request matching no route below is rejected by the proxy.
# The Server comes last on purpose: when it appears, its routes and authorizations already
# exist, so applying this file never leaves the port without its policy.
apiVersion: policy.linkerd.io/v1alpha1
kind: AuthorizationPolicy
metadata:
  name: emailservice-health
  namespace: default
  labels:
    app.kubernetes.io/part-of: zero-trust-policies
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: GRPCRoute
    name: emailservice-health
  requiredAuthenticationRefs:
  - group: policy.linkerd.io
    kind: NetworkAuthentication
    name: kubelet-probes
---
apiVersion: gateway.networking.k8s.io/v1
kind: GRPCRoute
metadata:
  name: emailservice-health
  namespace: default
  labels:
    app.kubernetes.io/part-of: zero-trust-policies
spec:
  parentRefs:
  - group: policy.linkerd.io
    kind: Server
    name: emailservice
  rules:
  - matches:
    - method:
        service: grpc.health.v1.Health
        method: Check
---
apiVersion: policy.linkerd.io/v1alpha1
kind: AuthorizationPolicy
metadata:
  name: emailservice-send
  namespace: default
  labels:
    app.kubernetes.io/part-of: zero-trust-policies
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: GRPCRoute
    name: emailservice-send
  requiredAuthenticationRefs:
  - group: policy.linkerd.io
    kind: MeshTLSAuthentication
    name: callers-checkout
---
apiVersion: gateway.networking.k8s.io/v1
kind: GRPCRoute
metadata:
  name: emailservice-send
  namespace: default
  labels:
    app.kubernetes.io/part-of: zero-trust-policies
spec:
  parentRefs:
  - group: policy.linkerd.io
    kind: Server
    name: emailservice
  rules:
  - matches:
    - method:
        service: hipstershop.EmailService
        method: SendOrderConfirmation
---
apiVersion: policy.linkerd.io/v1beta3
kind: Server
metadata:
  name: emailservice
  namespace: default
  labels:
    app.kubernetes.io/part-of: zero-trust-policies
spec:
  podSelector:
    matchLabels:
      app: emailservice
  port: 8080
  proxyProtocol: gRPC
