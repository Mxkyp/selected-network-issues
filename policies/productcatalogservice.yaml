# productcatalogservice (gRPC, port 3550)
#   hipstershop.ProductCatalogService/GetProduct       <- frontend, checkoutservice
#   hipstershop.ProductCatalogService/ListProducts     <- frontend, recommendationservice
#   hipstershop.ProductCatalogService/SearchProducts   <- nobody (the shop never calls it, so it has no route)
#   grpc.health.v1.Health/Check                        <- kubelet probes
# Everything else is denied: a request matching no route below is rejected by the proxy.
# The Server comes last on purpose: when it appears, its routes and authorizations already
# exist, so applying this file never leaves the port without its policy.
apiVersion: policy.linkerd.io/v1alpha1
kind: AuthorizationPolicy
metadata:
  name: productcatalogservice-health
  namespace: default
  labels:
    app.kubernetes.io/part-of: zero-trust-policies
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: GRPCRoute
    name: productcatalogservice-health
  requiredAuthenticationRefs:
  - group: policy.linkerd.io
    kind: NetworkAuthentication
    name: kubelet-probes
---
apiVersion: gateway.networking.k8s.io/v1
kind: GRPCRoute
metadata:
  name: productcatalogservice-health
  namespace: default
  labels:
    app.kubernetes.io/part-of: zero-trust-policies
spec:
  parentRefs:
  - group: policy.linkerd.io
    kind: Server
    name: productcatalogservice
  rules:
  - matches:
    - method:
        service: grpc.health.v1.Health
        method: Check
---
apiVersion: policy.linkerd.io/v1alpha1
kind: AuthorizationPolicy
metadata:
  name: productcatalogservice-getproduct
  namespace: default
  labels:
    app.kubernetes.io/part-of: zero-trust-policies
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: GRPCRoute
    name: productcatalogservice-getproduct
  requiredAuthenticationRefs:
  - group: policy.linkerd.io
    kind: MeshTLSAuthentication
    name: callers-frontend-checkout
---
apiVersion: gateway.networking.k8s.io/v1
kind: GRPCRoute
metadata:
  name: productcatalogservice-getproduct
  namespace: default
  labels:
    app.kubernetes.io/part-of: zero-trust-policies
spec:
  parentRefs:
  - group: policy.linkerd.io
    kind: Server
    name: productcatalogservice
  rules:
  - matches:
    - method:
        service: hipstershop.ProductCatalogService
        method: GetProduct
---
apiVersion: policy.linkerd.io/v1alpha1
kind: AuthorizationPolicy
metadata:
  name: productcatalogservice-list
  namespace: default
  labels:
    app.kubernetes.io/part-of: zero-trust-policies
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: GRPCRoute
    name: productcatalogservice-list
  requiredAuthenticationRefs:
  - group: policy.linkerd.io
    kind: MeshTLSAuthentication
    name: callers-frontend-recommendation
---
apiVersion: gateway.networking.k8s.io/v1
kind: GRPCRoute
metadata:
  name: productcatalogservice-list
  namespace: default
  labels:
    app.kubernetes.io/part-of: zero-trust-policies
spec:
  parentRefs:
  - group: policy.linkerd.io
    kind: Server
    name: productcatalogservice
  rules:
  - matches:
    - method:
        service: hipstershop.ProductCatalogService
        method: ListProducts
---
apiVersion: policy.linkerd.io/v1beta3
kind: Server
metadata:
  name: productcatalogservice
  namespace: default
  labels:
    app.kubernetes.io/part-of: zero-trust-policies
spec:
  podSelector:
    matchLabels:
      app: productcatalogservice
  port: 3550
  proxyProtocol: gRPC
