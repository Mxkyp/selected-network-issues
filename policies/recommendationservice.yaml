# recommendationservice (gRPC, port 8080)
#   hipstershop.RecommendationService/ListRecommendations   <- frontend
#   grpc.health.v1.Health/Check                             <- kubelet probes
# Everything else is denied: a request matching no route below is rejected by the proxy.
# The Server comes last on purpose: when it appears, its routes and authorizations already
# exist, so applying this file never leaves the port without its policy.
apiVersion: policy.linkerd.io/v1alpha1
kind: AuthorizationPolicy
metadata:
  name: recommendationservice-health
  namespace: default
  labels:
    app.kubernetes.io/part-of: zero-trust-policies
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: GRPCRoute
    name: recommendationservice-health
  requiredAuthenticationRefs:
  - group: policy.linkerd.io
    kind: NetworkAuthentication
    name: kubelet-probes
---
apiVersion: gateway.networking.k8s.io/v1
kind: GRPCRoute
metadata:
  name: recommendationservice-health
  namespace: default
  labels:
    app.kubernetes.io/part-of: zero-trust-policies
spec:
  parentRefs:
  - group: policy.linkerd.io
    kind: Server
    name: recommendationservice
  rules:
  - matches:
    - method:
        service: grpc.health.v1.Health
        method: Check
---
apiVersion: policy.linkerd.io/v1alpha1
kind: AuthorizationPolicy
metadata:
  name: recommendationservice-list
  namespace: default
  labels:
    app.kubernetes.io/part-of: zero-trust-policies
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: GRPCRoute
    name: recommendationservice-list
  requiredAuthenticationRefs:
  - group: policy.linkerd.io
    kind: MeshTLSAuthentication
    name: callers-frontend
---
apiVersion: gateway.networking.k8s.io/v1
kind: GRPCRoute
metadata:
  name: recommendationservice-list
  namespace: default
  labels:
    app.kubernetes.io/part-of: zero-trust-policies
spec:
  parentRefs:
  - group: policy.linkerd.io
    kind: Server
    name: recommendationservice
  rules:
  - matches:
    - method:
        service: hipstershop.RecommendationService
        method: ListRecommendations
---
apiVersion: policy.linkerd.io/v1beta3
kind: Server
metadata:
  name: recommendationservice
  namespace: default
  labels:
    app.kubernetes.io/part-of: zero-trust-policies
spec:
  podSelector:
    matchLabels:
      app: recommendationservice
  port: 8080
  proxyProtocol: gRPC
