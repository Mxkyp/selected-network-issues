# checkoutservice (gRPC, port 5050)
#   hipstershop.CheckoutService/PlaceOrder   <- frontend
#   grpc.health.v1.Health/Check              <- kubelet probes
# Everything else is denied: a request matching no route below is rejected by the proxy.
apiVersion: policy.linkerd.io/v1beta3
kind: Server
metadata:
  name: checkoutservice
  namespace: default
  labels:
    app.kubernetes.io/part-of: zero-trust-policies
spec:
  podSelector:
    matchLabels:
      app: checkoutservice
  port: 5050
  proxyProtocol: gRPC
---
apiVersion: gateway.networking.k8s.io/v1
kind: GRPCRoute
metadata:
  name: checkoutservice-health
  namespace: default
  labels:
    app.kubernetes.io/part-of: zero-trust-policies
spec:
  parentRefs:
  - group: policy.linkerd.io
    kind: Server
    name: checkoutservice
  rules:
  - matches:
    - method:
        service: grpc.health.v1.Health
        method: Check
---
apiVersion: policy.linkerd.io/v1alpha1
kind: AuthorizationPolicy
metadata:
  name: checkoutservice-health
  namespace: default
  labels:
    app.kubernetes.io/part-of: zero-trust-policies
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: GRPCRoute
    name: checkoutservice-health
  requiredAuthenticationRefs:
  - group: policy.linkerd.io
    kind: NetworkAuthentication
    name: kubelet-probes
---
apiVersion: gateway.networking.k8s.io/v1
kind: GRPCRoute
metadata:
  name: checkoutservice-placeorder
  namespace: default
  labels:
    app.kubernetes.io/part-of: zero-trust-policies
spec:
  parentRefs:
  - group: policy.linkerd.io
    kind: Server
    name: checkoutservice
  rules:
  - matches:
    - method:
        service: hipstershop.CheckoutService
        method: PlaceOrder
---
apiVersion: policy.linkerd.io/v1alpha1
kind: AuthorizationPolicy
metadata:
  name: checkoutservice-placeorder
  namespace: default
  labels:
    app.kubernetes.io/part-of: zero-trust-policies
spec:
  targetRef:
    group: gateway.networking.k8s.io
    kind: GRPCRoute
    name: checkoutservice-placeorder
  requiredAuthenticationRefs:
  - group: policy.linkerd.io
    kind: MeshTLSAuthentication
    name: callers-frontend
