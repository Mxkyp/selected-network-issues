# frontend (HTTP, port 8080): the public entry point of the shop.
# Any client may call it: browsers through the k3d load balancer, the loadgenerator and
# the kubelet probes. There are no routes, so the policy covers the whole port.
apiVersion: policy.linkerd.io/v1beta3
kind: Server
metadata:
  name: frontend
  namespace: default
  labels:
    app.kubernetes.io/part-of: zero-trust-policies
spec:
  podSelector:
    matchLabels:
      app: frontend
  port: 8080
  proxyProtocol: HTTP/1
---
apiVersion: policy.linkerd.io/v1alpha1
kind: AuthorizationPolicy
metadata:
  name: frontend
  namespace: default
  labels:
    app.kubernetes.io/part-of: zero-trust-policies
spec:
  targetRef:
    group: policy.linkerd.io
    kind: Server
    name: frontend
  requiredAuthenticationRefs:
  - group: policy.linkerd.io
    kind: NetworkAuthentication
    name: any-network
