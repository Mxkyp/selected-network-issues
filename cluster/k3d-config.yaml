apiVersion: k3d.io/v1alpha5
kind: Simple
metadata:
  name: sina
servers: 1
agents: 2
ports:
  - port: 8080:80          # localhost:8080 -> cluster load balancer -> the shop
    nodeFilters:
      - loadbalancer
  - port: 3000:3000        # localhost:3000 -> cluster load balancer -> Grafana
    nodeFilters:
      - loadbalancer
options:
  k3s:
    extraArgs:
      - arg: --disable=traefik   # its CRD chart clashes with the Gateway API CRDs that Linkerd needs
        nodeFilters:
          - server:*
